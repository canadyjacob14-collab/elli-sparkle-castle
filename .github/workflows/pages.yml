name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # If audio/ was not committed (or is incomplete), make the voice clips here.
      - name: Generate missing voice clips
        run: |
          want=$(python3 -c "import json;print(json.load(open('clips.json'))['count'])")
          have=$(ls audio/*.mp3 2>/dev/null | wc -l)
          echo "clips wanted=$want have=$have"
          if [ "$have" -lt "$want" ]; then
            sudo apt-get update -y && sudo apt-get install -y ffmpeg
            pip install edge-tts
            python3 gen_audio.py -j 8
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
